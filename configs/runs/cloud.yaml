# Single-GPU, sub-$100 recipe: base (FineWeb-Edu) -> SFT -> GRPO.
# Supply the provider's launch-time price via NANOGPT_HOURLY_RATE_USD and run
# `nanogpt probe` first; it reports the projected base cost for each candidate.
name: cloud
seed: 1337
model: gpt_100m
device: cuda
dtype: bfloat16
compile: true
deterministic: false
# Each gpt_100m checkpoint is ~1.2 GB (weights + AdamW state); keep the newest two.
# 0 keeps every SFT step checkpoint, so GRPO can start from one (grpo.init_step).
keep_checkpoints: 0

budget:
  hourly_rate_usd: null
  total_usd: 100.0
  checkpoint_reserve_seconds: 120

tokenizer:
  backend: hf
  vocab_size: 32768
  train_chars: 1000000000

data:
  source: fineweb
  # Pinned main revision observed 2026-07-29; changing it invalidates prepared shards.
  revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
  validation_fraction: 0.005
  shard_tokens: 100000000
  max_tokens: 2000000000
  budget_usd: 5.0

# 262,144 tokens/step (16 x 1024 x 16) x 7,630 steps ~= 2B tokens.
base:
  max_steps: 7630
  micro_batch_size: 16
  sequence_length: 1024
  gradient_accumulation_steps: 16
  learning_rate: 0.0006
  warmup_fraction: 0.02
  min_lr_fraction: 0.1
  weight_decay: 0.1
  grad_clip: 1.0
  log_every: 10
  eval_every: 250
  checkpoint_every: 500
  budget_usd: 62.0

# Retry recipe (2026-10-26): the first SFT (760 steps, 25k arithmetic, LR 2e-5)
# reached only 2.8% held-out arithmetic, too sparse for the GRPO pilot gate.
# More arithmetic, more steps and a higher LR target that gap.
sft:
  max_steps: 2000
  micro_batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 0.00005
  warmup_fraction: 0.03
  weight_decay: 0.01
  log_every: 10
  eval_every: 250
  checkpoint_every: 250
  eval_prompts: 200              # held-out 2-digit greedy accuracy at each eval
  budget_usd: 5.0
  sources:
    - kind: smoltalk
      revision: 5feaf2fd3ffca7c237fc38d1861bc30365d48ffa
      subsets: [smol-magpie-ultra, smol-constraints, smol-rewrite, smol-summarize]
      examples: 200000
      license: apache-2.0
    - {kind: gsm8k, revision: 740312add88f781978c0658806c59bc2815b9866, examples: 4500, license: MIT}
    # Carry-step answers: a bare sum is one BPE token, which GRPO could not improve.
    # Deliberately few examples (~2.5k seen in 2000 steps): 150k+ saturated 2- and
    # 3-digit sums at 100%, leaving GRPO nothing to learn. A weak SFT keeps pass@1
    # partial while pass@8 is higher, and GRPO's job is to close that gap.
    - {kind: arithmetic, examples: 4000, seed: 18001, answer_format: carry}

grpo:
  max_steps: 300
  micro_batch_size: 64           # prompts per optimizer step; 16 was too noisy
  learning_rate: 0.000001
  min_lr_fraction: 1.0
  weight_decay: 0.0
  log_every: 1
  checkpoint_every: 50
  eval_every: 25
  eval_prompts: 200
  budget_usd: 10.0
  # Arithmetic only: GSM8K prompts almost never earned a reward from this model,
  # so their groups had zero variance and only halved the useful batch.
  # 2-digit sums, where the weak SFT is partly right.
  sources:
    - {kind: arithmetic, examples: 20000, seed: 28001}
  group_size: 8
  temperature: 0.8
  top_k: 50
  max_new_tokens: 256
  ratio_clip_epsilon: 0.2
  reference_kl_beta: 0.02
  pilot_prompts: 128
  min_correct_fraction: 0.05
  min_mixed_group_fraction: 0.2
  # 16 prompts x 8 samples x ~500 tokens of 32k-vocab logits in one pass OOMed a 44 GB A40.
  update_chunk_prompts: 4

eval:
  validation_batches: 50
  reasoning_prompts: 500
  arithmetic_digits: [2]
  pass_k: 8
  max_new_tokens: 256
  budget_usd: 3.0

probe:
  candidates: [gpt_100m, gpt_50m]
  warmup_steps: 10
  measure_steps: 50
  safety_margin: 0.20
