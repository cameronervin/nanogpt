run_name: local_smoke
seed: 1337
device: auto
dtype: float32
model_config: configs/model/tiny.yaml
artifact_root: ./artifacts
compile: false
distributed: false
offline_fixture: true
num_workers: 0
base:
  max_steps: 20
  micro_batch_size: 2
  sequence_length: 64
  gradient_accumulation_steps: 1
  learning_rate: 0.001
  eval_interval: 10
  checkpoint_interval: 10
sft:
  max_steps: 20
  micro_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  eval_interval: 10
grpo:
  max_steps: 10
  prompts_per_step: 2
  group_size: 4
  max_new_tokens: 32
  learning_rate: 0.00001
evaluation:
  max_examples: 32
  deterministic: true
