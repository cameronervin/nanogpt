[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "from-scratch-nanogpt"
version = "0.1.0"
description = "A readable base, SFT, and GRPO training stack for a small decoder-only Transformer"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nano-GPT contributors" }]
dependencies = [
  "datasets>=3.6,<5",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0.2,<7",
  "safetensors>=0.5,<1",
  "tokenizers>=0.21,<1",
  "torch>=2.6,<3",
  "tqdm>=4.67,<5",
]

[project.scripts]
nanogpt = "nanogpt.commands.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nanogpt"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["^artifacts/"]

[[tool.mypy.overrides]]
module = ["datasets.*", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA device",
  "integration: exercises multiple modules or processes",
  "slow: unsuitable for the default local test loop",
]
